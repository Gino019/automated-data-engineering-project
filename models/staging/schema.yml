version: 2
models:
  - name: stg_orders
    description: Typed and cleaned raw orders, including cancelled/refunded status.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'refunded']
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: region
        data_tests: [not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [not_null, unique]
      - name: category
        data_tests: [not_null]
